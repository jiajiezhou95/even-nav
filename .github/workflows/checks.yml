name: checks
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run replay
      - run: npm run privacy:check
# Private fixtures are ignored and never read by CI; packaging uses dist allowlist.
